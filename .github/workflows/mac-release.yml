name: Build Mac app
on:
  workflow_dispatch:
    inputs:
      verify_existing:
        description: Verify the published disk image instead of building a new release
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  mac-app:
    if: ${{ !inputs.verify_existing }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/browsers
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          test "$(uname -m)" = arm64
          brew install python@3.11 node@24 poppler tesseract
          /opt/homebrew/bin/python3.11 -m venv build/venv
          build/venv/bin/pip install pyinstaller==6.22.3 playwright==1.58.0
          build/venv/bin/python -m playwright install chromium --only-shell
      - name: Test source
        run: |
          ln -s "$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -name chrome-headless-shell -print -quit | xargs dirname)" browser
          /opt/homebrew/bin/python3.11 -m unittest discover -s tests -v
          for test in tests/test_*.mjs; do /opt/homebrew/opt/node@24/bin/node "$test"; done
      - name: Bundle app runtime
        run: |
          export LOCALBOOKS_BROWSER="$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -name chrome-headless-shell -print -quit | xargs dirname)"
          build/venv/bin/pyinstaller --noconfirm packaging/release.spec
          build/venv/bin/python packaging/collect_notices.py
          build/venv/bin/python packaging/build_release.py
      - name: Test bundled app with isolated records
        run: |
          /opt/homebrew/bin/python3.11 tests/smoke_release.py
      - name: Package drag-to-install download
        run: |
          mkdir -p build/dmg
          mv release/LocalBooks.app build/dmg/
          ln -s /Applications build/dmg/Applications
          cp packaging/INSTALL.html 'build/dmg/Start here.html'
          hdiutil create -volname LocalBooks -srcfolder build/dmg -ov -format UDZO release/LocalBooks-1.1.1-macOS-AppleSilicon.dmg
          cd release
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LocalBooks-Mac-release
          path: release/*
          retention-days: 14
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.1 release/* --target "$GITHUB_SHA" --title 'LocalBooks 1.1.1 — Safer payments and clearer cash flow' --notes-file packaging/RELEASE_NOTES.md --latest

  verify-download:
    if: ${{ inputs.verify_existing }}
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download published app and verify checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download v1.1.1 --pattern '*.dmg' --pattern SHA256SUMS.txt --dir release
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          for line in Path('release/SHA256SUMS.txt').read_text().splitlines():
              expected, name = line.split(maxsplit=1)
              if name.endswith('.dmg'):
                  assert hashlib.sha256(Path('release', name).read_bytes()).hexdigest() == expected
          PYTHON
      - name: Verify the actual download with empty temporary records
        run: |
          mkdir -p "$RUNNER_TEMP/localbooks-image"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/localbooks-image" release/LocalBooks-1.1.1-macOS-AppleSilicon.dmg
          codesign --verify --deep --strict "$RUNNER_TEMP/localbooks-image/LocalBooks.app"
          python3 tests/smoke_release.py "$RUNNER_TEMP/localbooks-image/LocalBooks.app"
          hdiutil detach "$RUNNER_TEMP/localbooks-image"
